
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bn:#003066;--bb:#007BC0;--br:#ED0007;--bg:#007A5E;--bl:#E8F4FB;--gy:#3D3D3D}
.page{font-family:'Arial',sans-serif}
.header{background:var(--bn)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo-wrap{display:flex;align-items:center;gap:14px}
.logo-svg{height:42px;display:flex;align-items:center}
.logo-svg svg{height:42px;width:auto}
.logo-div{width:1px;height:36px;background:rgba(255,255,255,0.25)}
.logo-text .logo-dept{color:#fff;font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.25;font-family:'Arial',sans-serif}
.logo-text .logo-sub{color:rgba(255,255,255,0.45);font-size:11px;letter-spacing:.8px;text-transform:uppercase;margin-top:2px;font-family:'Arial',sans-serif}
.lang-row{display:flex;gap:4px}
.lb{font-size:12px;padding:4px 11px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:rgba(255,255,255,0.65);cursor:pointer;font-family:'Arial',sans-serif;font-weight:700;letter-spacing:.3px;border-radius:1px}
.lb.on{background:#fff;color:var(--bn);border-color:#fff}
.header-stripe{height:4px;background:var(--bb)}
.header-info{padding:16px 20px 18px}
.header-info h1{font-size:17px;font-weight:700;color:#fff;margin-bottom:4px;letter-spacing:.2px;font-family:'Arial',sans-serif}
.header-info p{font-size:13px;color:rgba(255,255,255,0.55);line-height:1.5;font-family:'Arial',sans-serif}
.prog-wrap{height:3px;background:rgba(255,255,255,0.1)}
.prog-fill{height:100%;background:var(--bb);transition:width .35s}

.step-nav{display:flex;background:#F4F4F4;border-bottom:1px solid #DDD;overflow-x:auto}
.step-tab{display:flex;align-items:center;gap:6px;padding:11px 14px;font-size:11px;font-weight:700;color:#AAA;white-space:nowrap;border-bottom:3px solid transparent;font-family:'Arial',sans-serif;text-transform:uppercase;letter-spacing:.5px}
.step-tab.done{color:var(--bg)}
.step-tab.active{color:var(--bb);border-bottom-color:var(--bb)}
.snum{width:18px;height:18px;border-radius:50%;background:#DDD;color:#AAA;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step-tab.active .snum{background:var(--bb);color:#fff}
.step-tab.done .snum{background:var(--bg);color:#fff}

.form-body{padding:20px 20px 6px}
.sec-title{font-size:13px;font-weight:700;color:var(--bn);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-family:'Arial',sans-serif}
.sec-desc{font-size:13px;color:#555;line-height:1.6;margin-bottom:16px;border-left:3px solid var(--bb);padding-left:9px;font-family:'Arial',sans-serif}

.field{margin-bottom:16px}
.field-label{font-size:12px;font-weight:700;color:var(--gy);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;display:flex;align-items:center;gap:4px;font-family:'Arial',sans-serif}
.req{color:var(--br)}
.hint{font-size:12px;color:#888;margin-bottom:6px;line-height:1.5;font-family:'Arial',sans-serif}

input[type=text],input[type=email],textarea{width:100%;font-size:14px;padding:9px 11px;border:1px solid #CCC;border-radius:1px;background:#fff;color:var(--gy);font-family:'Arial',sans-serif;outline:none;line-height:1.5}
input:focus,textarea:focus{border-color:var(--bb);box-shadow:0 0 0 2px rgba(0,123,192,0.13)}
textarea{resize:vertical;min-height:70px}

.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.ci{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #DDD;border-radius:1px;cursor:pointer;font-size:13px;color:#444;background:#fff;transition:all .1s;font-family:'Arial',sans-serif;line-height:1.3}
.ci:hover{border-color:var(--bb);background:#F0F8FF}
.ci.on{border-color:var(--bb);background:var(--bl);color:var(--bn);font-weight:700}
.ci i{font-size:15px;color:#BBB;flex-shrink:0}
.ci.on i{color:var(--bb)}
.cbox{width:15px;height:15px;border:1.5px solid #CCC;border-radius:1px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;background:#fff;min-width:15px}
.ci.on .cbox{background:var(--bb);border-color:var(--bb)}

.rg{display:flex;flex-direction:column;gap:5px}
.ri{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid #DDD;border-radius:1px;cursor:pointer;font-size:13px;color:#444;background:#fff;transition:all .1s;font-family:'Arial',sans-serif;line-height:1.3}
.ri:hover{border-color:var(--bb);background:#F0F8FF}
.ri.on{border-color:var(--bb);background:var(--bl);color:var(--bn);font-weight:700}
.rc{width:15px;height:15px;border:1.5px solid #CCC;border-radius:50%;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:center;min-width:15px}
.ri.on .rc{border-color:var(--bb)}
.ri.on .rc::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--bb);display:block}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.divider{height:1px;background:#EEE;margin:14px 0}

.nav-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#F4F4F4;border-top:1px solid #DDD}
.sc{font-size:11px;color:#AAA;font-weight:700;text-transform:uppercase;letter-spacing:.4px;font-family:'Arial',sans-serif}
.btn-back{font-size:12px;padding:8px 16px;border:1px solid #CCC;border-radius:1px;background:#fff;color:#555;cursor:pointer;font-family:'Arial',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.btn-back:hover{background:#F5F5F5}
.btn-next{font-size:12px;padding:8px 18px;border:none;border-radius:1px;background:var(--bb);color:#fff;cursor:pointer;font-family:'Arial',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.btn-next:hover{background:var(--bn)}
.btn-submit{font-size:12px;padding:8px 18px;border:none;border-radius:1px;background:var(--br);color:#fff;cursor:pointer;font-family:'Arial',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.btn-submit:hover{background:#B5000F}

.success-wrap{padding:28px 20px;text-align:center}
.success-icon{width:56px;height:56px;border-radius:50%;background:#E6F7F0;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px;color:var(--bg)}
.success-title{font-size:17px;font-weight:700;color:var(--bn);margin-bottom:6px;font-family:'Arial',sans-serif}
.success-sub{font-size:13px;color:#555;line-height:1.7;margin-bottom:16px;font-family:'Arial',sans-serif}
.sum-card{background:#F8F8F8;border:1px solid #E0E0E0;border-radius:1px;padding:14px 16px;text-align:left;margin-bottom:14px}
.sum-head{font-size:11px;font-weight:700;color:var(--bn);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;padding-bottom:7px;border-bottom:2px solid var(--bb);font-family:'Arial',sans-serif}
.sum-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #EEE;font-size:13px;gap:12px;font-family:'Arial',sans-serif}
.sum-row:last-child{border-bottom:none}
.sk{color:#888;flex-shrink:0}
.sv{color:var(--bn);font-weight:700;text-align:right}
.btn-reset{font-size:12px;padding:8px 18px;border:1px solid var(--bb);border-radius:1px;background:#fff;color:var(--bb);cursor:pointer;font-family:'Arial',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.btn-reset:hover{background:var(--bl)}
</style>

    cats:[{k:"incident",l:"Vorfallmanagement",i:"ti-alert-triangle"},{k:"risk",l:"Risikobewertung",i:"ti-shield-check"},{k:"legal",l:"Rechtliche Compliance",i:"ti-gavel"},{k:"training",l:"EHS-Schulung & Lernmanagement",i:"ti-school"},{k:"audit",l:"Audit-Management-Tool",i:"ti-clipboard-check"},{k:"chemical",l:"Chemikalienmanagement",i:"ti-flask"},{k:"contractor",l:"Auftragnehmer-Management",i:"ti-users"},{k:"fire",l:"Brandschutz",i:"ti-flame"},{k:"other",l:"Sonstige",i:"ti-dots-circle-horizontal"}],

    imt:["Weniger als 1 Monat","1 bis 3 Monate","3 bis 6 Monate","Mehr als 6 Monate"],

let lang="es",step=0;
const N=6;
const S={nm:"",ct:"",pb:"",bn:[],or:"",lv:"",ac:[],it:"",is:"",tr:"",ob:[],cm:"",cr:"",cn:"",uc:"",pf:[],fq:"",sf:"",ds:"",ia:"",dc:[],rn:"",re:"",rr:""};

function setLang(l,btn){lang=l;document.querySelectorAll('.lb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.getElementById('hdr-t').textContent=T[lang].ht;document.getElementById('hdr-s').textContent=T[lang].hs;RA();}
function ss(k,v){S[k]=v;}
function ta(k,v,m){const a=S[k];if(a.includes(v)){S[k]=a.filter(x=>x!==v);}else if(a.length<m){S[k]=[...a,v];}RA();}
function radioO(key,opts,sel){return`<div class="rg">`+opts.map(o=>`<div class="ri${sel===o.k?' on':''}" onclick="ss('${key}','${o.k}');RA()"><div class="rc"></div>${o.l}</div>`).join('')+'</div>';}
function radioS(key,opts,sel){return`<div class="rg">`+opts.map(o=>`<div class="ri${sel===o?' on':''}" onclick="ss('${key}','${o.replace(/'/g,"\\'")}');RA()"><div class="rc"></div>${o}</div>`).join('')+'</div>';}
function chkCat(key,opts,sel){return`<div class="check-grid">`+opts.map(o=>`<div class="ci${sel===o.k?' on':''}" onclick="ss('${key}','${o.k}');RA()"><i class="ti ${o.i}" aria-hidden="true"></i><div class="cbox">${sel===o.k?'✓':''}</div>${o.l}</div>`).join('')+'</div>';}
function chkS(key,opts,sel,m){return`<div class="check-grid">`+opts.map(o=>`<div class="ci${sel.includes(o)?' on':''}" onclick="ta('${key}','${o.replace(/'/g,"\\'")}',${m})"><div class="cbox">${sel.includes(o)?'✓':''}</div>${o}</div>`).join('')+'</div>';}
function fld(label,req,hint,content){return`<div class="field"><div class="field-label">${label}${req?` <span class="req">*</span>`:''}</div>${hint?`<div class="hint">${hint}</div>`:''}${content}</div>`;}

function renderBody(){
  const L=T[lang],f=L.f;
  let h=`<div class="sec-title">${L.steps[step]}</div><div class="sec-desc">${L.sd[step]}</div>`;
  if(step===0){
    h+=fld(f.nm,1,f.nmh,`<input type="text" maxlength="60" value="${S.nm}" oninput="S.nm=this.value" placeholder="${f.nmh}">`);
    h+=fld(f.ct,1,f.cth,chkCat('ct',L.cats,S.ct));
    h+=fld(f.pb,1,f.pbh,`<textarea maxlength="200" oninput="S.pb=this.value">${S.pb}</textarea>`);
    h+=fld(f.bn,1,f.bnh,chkS('bn',L.ben,S.bn,2));
  }else if(step===1){
    h+=fld(f.or,1,'',radioO('or',L.ori,S.or));
    h+=fld(f.lv,1,'',radioO('lv',L.lev,S.lv));
    h+=fld(f.ac,0,'',chkS('ac',L.acc,S.ac,4));
  }else if(step===2){
    h+=fld(f.it,1,'',radioS('it',L.imt,S.it));
    h+=fld(f.is,1,'',radioS('is',L.its,S.is));
    h+=fld(f.tr,1,'',radioS('tr',L.trt,S.tr));
    h+=fld(f.ob,0,'',chkS('ob',L.obs,S.ob,2));
  }else if(step===3){
    h+=fld(f.cm,1,'',radioS('cm',L.cmo,S.cm));
    h+=fld(f.cr,1,'',radioS('cr',L.crg,S.cr));
    h+=fld(f.cn,1,'',radioS('cn',L.cnt,S.cn));
  }else if(step===4){
    h+=fld(f.uc,1,'',radioS('uc',L.uct,S.uc));
    h+=fld(f.pf,0,'',chkS('pf',L.prf,S.pf,6));
    h+=fld(f.fq,1,'',radioS('fq',L.frq,S.fq));
    h+=fld(f.sf,1,'',radioS('sf',L.sat,S.sf));
  }else if(step===5){
    h+=fld(f.ds,1,'',radioS('ds',L.dst,S.ds));
    h+=fld(f.ia,1,'',radioS('ia',L.iap,S.ia));
    h+=fld(f.dc,0,'',chkS('dc',L.doc,S.dc,5));
    h+=`<div class="divider"></div>`;
    h+=`<div class="two-col">${fld(f.rn,1,'',`<input type="text" value="${S.rn}" oninput="S.rn=this.value" placeholder="${f.rnh}">`)
        }${fld(f.re,1,'',`<input type="email" value="${S.re}" oninput="S.re=this.value" placeholder="${f.reh}">`)}</div>`;
    h+=fld(f.rr,0,'',`<input type="text" value="${S.rr}" oninput="S.rr=this.value" placeholder="${f.rrh}">`);
  }
  document.getElementById('fbody').innerHTML=h;
}

function renderNav(){
  const L=T[lang];
  const back=step>0?`<button class="btn-back" onclick="go(${step-1})">${L.bck}</button>`:`<span></span>`;
  const fwd=step<N-1
    ?`<div style="display:flex;align-items:center;gap:10px"><span class="sc">${step+1} ${L.of} ${N}</span><button class="btn-next" onclick="go(${step+1})">${L.nxt}</button></div>`
    :`<div style="display:flex;align-items:center;gap:10px"><span class="sc">${step+1} ${L.of} ${N}</span><button class="btn-submit" onclick="done()">${L.sub}</button></div>`;
  document.getElementById('nbar').innerHTML=back+fwd;
}

function renderStepNav(){
  const L=T[lang];
  let h='';
  for(let i=0;i<N;i++){
    const c=i<step?'done':i===step?'active':'';
    h+=`<div class="step-tab ${c}"><div class="snum">${i<step?'<i class="ti ti-check" style="font-size:9px"></i>':i+1}</div>${L.steps[i]}</div>`;
  }
  document.getElementById('snav').innerHTML=h;
}

function RA(){renderStepNav();renderBody();renderNav();document.getElementById('prog').style.width=((step+1)/N*100)+'%';}
function go(s){step=s;RA();}

const SITE_URL="https://bosch.sharepoint.com/sites/msteams_20fa2d86";

async function done(){
  const L=T[lang];
  const btn=document.querySelector('.btn-submit');
  if(btn){btn.disabled=true;btn.textContent='Sending...';}
  try{
    const digestRes=await fetch(SITE_URL+'/_api/contextinfo',{method:'POST',headers:{'Accept':'application/json;odata=verbose'}});
    const digestData=await digestRes.json();
    const digest=digestData.d.GetContextWebInformation.FormDigestValue;
    const starMap={'\u2b50\u2b50\u2b50\u2b50\u2b50':5,'\u2b50\u2b50\u2b50\u2b50':4,'\u2b50\u2b50\u2b50':3,'\u2b50\u2b50':2,'\u2b50':1};
    const stars=Object.entries(starMap).find(([k])=>S.sf.startsWith(k))?.[1]||3;
    const initials=S.rn.trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,3);
    const body={
      '__metadata':{'type':'SP.Data.EHS_ToolsListItem'},
      'Title':S.nm,
      'Category':S.ct,
      'Problem':S.pb,
      'Benefits':S.bn.join(', '),
      'Origin':S.or,
      'Level':S.lv,
      'AccessType':S.ac.join(', '),
      'ImplTime':S.it,
      'ITSupport':S.is,
      'TrainingTime':S.tr,
      'Obstacles':S.ob.join(', '),
      'CostModel':S.cm,
      'CostRange':S.cr,
      'AcquisitionType':S.cn,
      'UserCount':S.uc,
      'Profiles':S.pf.join(', '),
      'Frequency':S.fq,
      'Satisfaction':S.sf,
      'Stars':stars,
      'DataStorage':S.ds,
      'ITApproval':S.ia,
      'Documentation':S.dc.join(', '),
      'ContactName':S.rn,
      'ContactEmail':S.re,
      'ContactRole':S.rr,
      'ContactInit':initials,
      'Status':'pending'
    };
    const res=await fetch(SITE_URL+"/_api/lists/getbytitle('HSEEE Software tools')/items",{
      method:'POST',
      headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose','X-RequestDigest':digest},
      body:JSON.stringify(body)
    });
    if(!res.ok)throw new Error('HTTP '+res.status);
    showSuccess();
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent=T[lang].sub;}
    alert('Error saving the form. Please try again or contact your administrator.\n\nDetail: '+e.message);
  }
}

function showSuccess(){
  const L=T[lang];
  const catO=L.cats.find(c=>c.k===S.ct);
  const oriO=L.ori.find(o=>o.k===S.or);
  const levO=L.lev.find(o=>o.k===S.lv);
  document.getElementById('snav').innerHTML='';
  document.getElementById('nbar').innerHTML='';
  document.getElementById('prog').style.width='100%';
  document.getElementById('fbody').innerHTML=`
    <div class="success-wrap">
      <div class="success-icon"><i class="ti ti-circle-check" aria-hidden="true"></i></div>
      <div class="success-title">${L.ok}</div>
      <div class="success-sub">${L.oks}</div>
      <div class="sum-card">
        <div class="sum-head">${L.okh}</div>
        <div class="sum-row"><span class="sk">Tool</span><span class="sv">${S.nm||'—'}</span></div>
        <div class="sum-row"><span class="sk">Categoría / Type</span><span class="sv">${catO?catO.l:'—'}</span></div>
        <div class="sum-row"><span class="sk">Origen / Origin</span><span class="sv">${oriO?oriO.l:'—'}</span></div>
        <div class="sum-row"><span class="sk">Nivel / Level</span><span class="sv">${levO?levO.l:'—'}</span></div>
        <div class="sum-row"><span class="sk">Costo / Cost</span><span class="sv">${S.cr||'—'}</span></div>
        <div class="sum-row"><span class="sk">Beneficios / Benefits</span><span class="sv">${S.bn.join(' · ')||'—'}</span></div>
        <div class="sum-row"><span class="sk">Contacto / Contact</span><span class="sv">${S.rn||'—'}</span></div>
      </div>
      <button class="btn-reset" onclick="reset()">${L.okn}</button>
    </div>`;
}


function reset(){Object.keys(S).forEach(k=>S[k]=Array.isArray(S[k])?[]:'' );step=0;RA();}
RA();
</script>
