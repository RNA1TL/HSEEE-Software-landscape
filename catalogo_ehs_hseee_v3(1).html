
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bn:#003066;--bb:#007BC0;--br:#ED0007;--bg:#007A5E;--bl:#E8F4FB;--gy:#3D3D3D}
.page{font-family:'Arial',sans-serif}
.header{background:var(--bn)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo-wrap{display:flex;align-items:center;gap:14px}
.logo-svg{height:42px;display:flex;align-items:center}
.logo-svg svg{height:42px;width:auto}
.logo-div{width:1px;height:36px;background:rgba(255,255,255,0.25)}
.logo-dept{color:#fff;font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.25;font-family:'Arial',sans-serif}
.logo-sub{color:rgba(255,255,255,0.42);font-size:11px;letter-spacing:.8px;text-transform:uppercase;margin-top:2px;font-family:'Arial',sans-serif}
.lang-row{display:flex;gap:4px}
.lb{font-size:12px;padding:4px 11px;border:1px solid rgba(255,255,255,0.3);background:transparent;color:rgba(255,255,255,0.65);cursor:pointer;font-family:'Arial',sans-serif;font-weight:700;letter-spacing:.3px;border-radius:1px}
.lb.on{background:#fff;color:var(--bn);border-color:#fff}
.header-stripe{height:4px;background:var(--bb)}
.header-body{padding:14px 18px 16px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px}
.header-titles h1{font-size:16px;font-weight:700;color:#fff;margin-bottom:3px;letter-spacing:.2px;font-family:'Arial',sans-serif}
.header-titles p{font-size:13px;color:rgba(255,255,255,0.5);line-height:1.5;font-family:'Arial',sans-serif}
.header-stats{display:flex;gap:10px}
.hstat{text-align:center;border-left:1px solid rgba(255,255,255,0.15);padding-left:12px}
.hstat-num{font-size:20px;font-weight:700;color:#fff;line-height:1;font-family:'Arial',sans-serif}
.hstat-lbl{font-size:10px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;font-family:'Arial',sans-serif}

.toolbar{background:#F4F4F4;border-bottom:1px solid #DDD;padding:10px 18px;display:flex;flex-direction:column;gap:8px}
.search-wrap{position:relative}
.search-wrap i{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:15px;color:#AAA;pointer-events:none}
.search-wrap input{width:100%;padding:8px 10px 8px 30px;font-size:13px;border:1px solid #CCC;border-radius:1px;background:#fff;color:var(--gy);font-family:'Arial',sans-serif;outline:none}
.search-wrap input:focus{border-color:var(--bb)}
.filter-label{font-size:11px;font-weight:700;color:#AAA;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;font-family:'Arial',sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:5px 11px;border:1px solid #CCC;background:#fff;color:#555;cursor:pointer;font-family:'Arial',sans-serif;font-weight:700;display:flex;align-items:center;gap:5px;border-radius:1px;letter-spacing:.2px}
.chip:hover{border-color:var(--bb);color:var(--bb)}
.chip.on{background:var(--bn);border-color:var(--bn);color:#fff}
.chip i{font-size:13px}

.catalog-body{padding:14px 18px}
.meta{font-size:11px;color:#AAA;font-family:'Arial',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--bb)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

.card{background:#fff;border:1px solid #DDD;border-top:3px solid transparent;cursor:pointer;transition:border-color .15s;display:flex;flex-direction:column}
.card:hover{border-color:var(--bb);border-top-color:var(--bb)}
.card-inner{padding:13px 14px;flex:1;display:flex;flex-direction:column}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:6px}
.card-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;border:1px solid #EEE}
.badges{display:flex;gap:3px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 6px;font-weight:700;font-family:'Arial',sans-serif;letter-spacing:.2px}
.b-int{background:#E6F7F0;color:#005740;border:1px solid #9FD9C5}
.b-ext{background:#EEEDFE;color:#3C3489;border:1px solid #AFA9EC}
.b-mix{background:#FFF3E0;color:#7A4500;border:1px solid #FFCC80}
.b-gl{background:var(--bl);color:#003066;border:1px solid #85B7EB}
.b-re{background:#F4F4F4;color:#555;border:1px solid #CCC}
.b-si{background:#F4F4F4;color:#777;border:1px solid #DDD}
.card-cat{font-size:11px;font-weight:700;color:var(--bb);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;display:flex;align-items:center;gap:4px;font-family:'Arial',sans-serif}
.card-cat i{font-size:12px}
.card-name{font-size:14px;font-weight:700;color:var(--bn);margin-bottom:5px;line-height:1.3;font-family:'Arial',sans-serif}
.card-purpose{font-size:13px;color:#444;line-height:1.55;margin-bottom:9px;flex:1;font-family:'Arial',sans-serif}
.card-bens{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:9px}
.ben{font-size:11px;padding:2px 7px;background:#F4F4F4;color:#555;border:1px solid #DDD;font-family:'Arial',sans-serif;font-weight:700}
.card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #EEE;padding:8px 14px;background:#FAFAFA}
.stars{display:flex;gap:1px}
.star{font-size:13px;color:#BA7517}
.star.off{color:#DDD}
.cost{font-size:12px;color:#666;font-family:'Arial',sans-serif;font-weight:700}

.empty{text-align:center;padding:2rem;color:#AAA;font-size:13px;font-family:'Arial',sans-serif}
.modal-bg{background:rgba(0,0,0,0.45);display:none;align-items:flex-start;justify-content:center;min-height:500px;padding:1.5rem 1rem}
.modal-bg.open{display:flex}
.modal{background:#fff;border:1px solid #CCC;width:100%;max-width:500px}
.modal-header{background:var(--bn);padding:14px 16px;display:flex;align-items:center;gap:10px}
.modal-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:1px solid rgba(255,255,255,0.2)}
.modal-name{font-size:15px;font-weight:700;color:#fff;font-family:'Arial',sans-serif;line-height:1.3}
.modal-sub{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;font-family:'Arial',sans-serif}
.modal-close{margin-left:auto;background:none;border:none;color:rgba(255,255,255,0.6);font-size:18px;cursor:pointer;padding:2px 5px}
.modal-stripe{height:3px;background:var(--bb)}
.modal-body{padding:16px}
.dl{font-size:11px;font-weight:700;color:var(--bb);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;margin-top:12px;padding-bottom:3px;border-bottom:1px solid #EEE;font-family:'Arial',sans-serif}
.dl:first-child{margin-top:0}
.dv{font-size:13px;color:var(--gy);line-height:1.6;font-family:'Arial',sans-serif}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.dc{font-size:12px;padding:5px 9px;background:#F4F4F4;color:#444;border:1px solid #DDD;font-family:'Arial',sans-serif;font-weight:700}
.contact-row{display:flex;align-items:center;gap:9px;padding:10px 11px;background:#F4F4F4;border:1px solid #DDD;margin-top:4px}
.av{width:32px;height:32px;border-radius:50%;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--bn);flex-shrink:0;border:1px solid #85B7EB;font-family:'Arial',sans-serif}
.cn{font-size:14px;font-weight:700;color:var(--bn);font-family:'Arial',sans-serif}
.cr{font-size:12px;color:#777;font-family:'Arial',sans-serif}
.mbtn{width:100%;margin-top:14px;padding:10px;font-size:12px;border:none;background:var(--bb);color:#fff;cursor:pointer;font-family:'Arial',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.mbtn:hover{background:var(--bn)}
</style>

<div class="page">
<div class="header">

          <rect width="560.2" height="223.6" style="fill:none"/>

        </svg>
      </div>
      <div class="logo-div"></div>
      <div>
        <div class="logo-dept">HSEEE WP4 C/SEY-MX</div>
        <div class="logo-sub">Digital Tools Catalog</div>
      </div>
    </div>
    <div class="lang-row">
      <button class="lb on" onclick="setLang('es',this)">ES</button>
      <button class="lb" onclick="setLang('en',this)">EN</button>
      <button class="lb" onclick="setLang('de',this)">DE</button>
    </div>
  </div>
  <div class="header-stripe"></div>
  <div class="header-body">
    <div class="header-titles">
      <h1 id="hdr-t">Catálogo de Herramientas Digitales EHS</h1>
      <p id="hdr-s">Encuentra y adopta las herramientas EHS que otros sitios Bosch ya utilizan</p>

</div>

<div class="toolbar">
  <div class="search-wrap">
    <i class="ti ti-search" aria-hidden="true"></i>
    <input type="text" id="search" oninput="render()" placeholder="">
  </div>
  <div>
    <div class="filter-label" id="fl"></div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div class="catalog-body">
  <div class="meta" id="meta"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="modal-bg" id="mbg" onclick="closeMod(event)">
  <div class="modal" id="modal"></div>
</div>
</div>

<script>
const I18={
  es:{ht:"Catálogo de Herramientas Digitales EHS",hs:"Encuentra y adopta las herramientas EHS que otros sitios Bosch ya utilizan",search:"Busca por nombre, problema o categoría…",fl:"Filtrar por tipo de aplicación EHS:",all:"Todas",meta:n=>n+" herramienta"+(n!==1?"s":"")+" encontrada"+(n!==1?"s":""),stT:"Herramientas",stC:"Categorías",stR:"Regiones",ori:{int:"Interna Bosch",ext:"Externa",mix:"Mixta"},lev:{gl:"Global",re:"Regional",si:"Por sitio"},lbl:{prob:"Problema que resuelve",ben:"Beneficios clave",cm:"Modelo de costo",cr:"Rango de costo",impl:"Implementación",us:"Usuarios en sitio",docs:"Documentación disponible",ct:"Contacto responsable",btn:"Quiero implementar esta herramienta en mi sitio ↗"}},
  en:{ht:"EHS Digital Tools Catalog",hs:"Find and adopt EHS tools already used by other Bosch sites",search:"Search by name, problem or category…",fl:"Filter by EHS application type:",all:"All",meta:n=>n+" tool"+(n!==1?"s":"")+" found",stT:"Tools",stC:"Categories",stR:"Regions",ori:{int:"Bosch Internal",ext:"External",mix:"Mixed"},lev:{gl:"Global",re:"Regional",si:"Site-level"},lbl:{prob:"Problem it solves",ben:"Key benefits",cm:"Cost model",cr:"Cost range",impl:"Implementation",us:"Users on site",docs:"Available documentation",ct:"Responsible contact",btn:"I want to implement this tool at my site ↗"}},
  de:{ht:"EHS Digital Tools Katalog",hs:"Finden und übernehmen Sie EHS-Tools, die andere Bosch-Standorte bereits nutzen",search:"Nach Name, Problem oder Kategorie suchen…",fl:"Nach EHS-Anwendungstyp filtern:",all:"Alle",meta:n=>n+" Tool"+(n!==1?"s":"")+" gefunden",stT:"Tools",stC:"Kategorien",stR:"Regionen",ori:{int:"Intern Bosch",ext:"Extern",mix:"Gemischt"},lev:{gl:"Global",re:"Regional",si:"Standort"},lbl:{prob:"Gelöstes Problem",ben:"Hauptvorteile",cm:"Kostenmodell",cr:"Kostenbereich",impl:"Implementierung",us:"Nutzer am Standort",docs:"Verfügbare Dokumentation",ct:"Verantwortlicher Kontakt",btn:"Ich möchte dieses Tool an meinem Standort einführen ↗"}}
};
const CATS=[
  {k:"incident",i:"ti-alert-triangle",bg:"#FFF0F0",ic:"#ED0007",label:{es:"Incident management",en:"Incident management",de:"Vorfallmanagement"}},
  {k:"risk",i:"ti-shield-check",bg:"#FFF4EE",ic:"#993C1D",label:{es:"Risk Assessment",en:"Risk Assessment",de:"Risikobewertung"}},
  {k:"legal",i:"ti-gavel",bg:"#F0EEFF",ic:"#3C3489",label:{es:"Legal compliance",en:"Legal compliance",de:"Rechtliche Compliance"}},
  {k:"training",i:"ti-school",bg:"#E8F7F0",ic:"#005740",label:{es:"EHS training & learning",en:"EHS training & learning",de:"EHS-Schulung & Lernen"}},
  {k:"audit",i:"ti-clipboard-check",bg:"#EAF3DE",ic:"#27500A",label:{es:"Audit management",en:"Audit management",de:"Audit-Management"}},
  {k:"chemical",i:"ti-flask",bg:"#FFF8E8",ic:"#633806",label:{es:"Chemical management",en:"Chemical management",de:"Chemikalienmanagement"}},
  {k:"contractor",i:"ti-users",bg:"#E8F4FB",ic:"#003066",label:{es:"Contractor management",en:"Contractor management",de:"Auftragnehmer-Mgmt."}},
  {k:"fire",i:"ti-flame",bg:"#FFF0F5",ic:"#72243E",label:{es:"Fire protection",en:"Fire protection",de:"Brandschutz"}},
  {k:"other",i:"ti-dots-circle-horizontal",bg:"#F4F4F4",ic:"#555",label:{es:"Otro / Other",en:"Other",de:"Sonstige"}},
];
const SITE_URL="https://YOUR-TENANT.sharepoint.com/sites/YOUR-SITE";
let TOOLS=[];

let lang="es",af="all";

function setLang(l,btn){
  lang=l;document.querySelectorAll('.lb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  document.getElementById('hdr-t').textContent=I18[lang].ht;
  document.getElementById('hdr-s').textContent=I18[lang].hs;
  document.getElementById('search').placeholder=I18[lang].search;
  document.getElementById('fl').textContent=I18[lang].fl;
  document.getElementById('stat-t').textContent=I18[lang].stT;
  document.getElementById('stat-c').textContent=I18[lang].stC;
  document.getElementById('stat-r').textContent=I18[lang].stR;
  buildChips();render();
}
function buildChips(){
  document.getElementById('chips').innerHTML=
    `<span class="chip${af==='all'?' on':''}" data-f="all" onclick="setF(this)"><i class="ti ti-apps" aria-hidden="true"></i>${I18[lang].all}</span>`
    +CATS.map(c=>`<span class="chip${af===c.k?' on':''}" data-f="${c.k}" onclick="setF(this)"><i class="ti ${c.i}" aria-hidden="true"></i>${c.label[lang]}</span>`).join('');
}
function setF(el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');af=el.dataset.f;render();}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const L=I18[lang];
  const filtered=TOOLS.filter(t=>(af==='all'||t.cat===af)&&(!q||t.name.toLowerCase().includes(q)||t.problem.toLowerCase().includes(q)||t.benefits.some(b=>b.toLowerCase().includes(q))));
  document.getElementById('stat-n').textContent=filtered.length;
  document.getElementById('meta').textContent=L.meta(filtered.length);
  const grid=document.getElementById('grid');
  if(!filtered.length){grid.innerHTML=`<div class="empty"><i class="ti ti-zoom-exclamation" style="font-size:26px;display:block;margin-bottom:8px"></i>No results</div>`;return;}
  grid.innerHTML=filtered.map(t=>{
    const cat=CATS.find(c=>c.k===t.cat)||CATS[8];
    return`<div class="card" onclick="openMod('${t.name.replace(/'/g,"\\'")}')">
      <div class="card-inner">
        <div class="card-top">
          <div class="card-icon" style="background:${cat.bg}"><i class="ti ${cat.i}" style="color:${cat.ic}" aria-hidden="true"></i></div>
          <div class="badges">
            <span class="badge ${t.origin==='int'?'b-int':t.origin==='ext'?'b-ext':'b-mix'}">${L.ori[t.origin]}</span>
            <span class="badge ${t.level==='gl'?'b-gl':t.level==='re'?'b-re':'b-si'}">${L.lev[t.level]}</span>
          </div>
        </div>
        <div class="card-cat"><i class="ti ${cat.i}" aria-hidden="true"></i>${cat.label[lang]}</div>
        <div class="card-name">${t.name}</div>
        <div class="card-purpose">${t.problem}</div>
        <div class="card-bens">${t.benefits.map(b=>`<span class="ben">${b}</span>`).join('')}</div>
      </div>
      <div class="card-footer">
        <div class="stars">${[1,2,3,4,5].map(s=>`<span class="star${s<=t.stars?'':' off'}">★</span>`).join('')}</div>
        <span class="cost">${t.costRange}</span>
      </div>
    </div>`;
  }).join('');
}
function openMod(name){
  const t=TOOLS.find(x=>x.name===name);if(!t)return;
  const L=I18[lang];const lb=L.lbl;
  const cat=CATS.find(c=>c.k===t.cat)||CATS[8];
  document.getElementById('modal').innerHTML=`
    <div class="modal-header">
      <div class="modal-icon" style="background:${cat.bg}"><i class="ti ${cat.i}" style="color:${cat.ic};font-size:18px" aria-hidden="true"></i></div>
      <div style="flex:1"><div class="modal-name">${t.name}</div><div class="modal-sub">${cat.label[lang]} · ${L.ori[t.origin]} · ${L.lev[t.level]}</div></div>
      <button class="modal-close" onclick="closeMod()" aria-label="Close"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-stripe"></div>
    <div class="modal-body">
      <div class="dl">${lb.prob}</div><div class="dv">${t.problem}</div>
      <div class="dl">${lb.ben}</div>
      <div class="dgrid" style="grid-template-columns:1fr">${t.benefits.map(b=>`<span class="dc">${b}</span>`).join('')}</div>
      <div class="dl" style="margin-top:14px;border-bottom:none;padding-bottom:0"></div>
      <div class="dgrid">
        <div><div style="font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;font-family:'Arial',sans-serif">${lb.cm}</div><div class="dv" style="font-size:13px">${t.costModel}</div></div>
        <div><div style="font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;font-family:'Arial',sans-serif">${lb.cr}</div><div class="dv" style="font-size:13px">${t.costRange}</div></div>
        <div><div style="font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;font-family:'Arial',sans-serif">${lb.impl}</div><div class="dv" style="font-size:13px">${t.impl}</div></div>
        <div><div style="font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;font-family:'Arial',sans-serif">${lb.us}</div><div class="dv" style="font-size:13px">${t.users}</div></div>
      </div>
      <div class="dl">${lb.docs}</div>
      <div class="dgrid" style="grid-template-columns:1fr">${t.docs.map(d=>`<span class="dc"><i class="ti ti-file" style="font-size:11px;margin-right:4px" aria-hidden="true"></i>${d}</span>`).join('')}</div>
      <div class="dl">${lb.ct}</div>
      <div class="contact-row">
        <div class="av">${t.contact.init}</div>
        <div><div class="cn">${t.contact.name}</div><div class="cr">${t.contact.role}</div></div>
      </div>
      <button class="mbtn" onclick="sendPrompt('Quiero implementar ${t.name} en mi sitio Bosch. ¿Cuáles son los pasos y consideraciones clave?')">${lb.btn}</button>
    </div>`;
  document.getElementById('mbg').classList.add('open');
}
function closeMod(e){if(!e||e.target===document.getElementById('mbg'))document.getElementById('mbg').classList.remove('open');}
async function loadTools(){
  const grid=document.getElementById('grid');
  grid.innerHTML='<div class="empty"><i class="ti ti-refresh" style="font-size:26px;display:block;margin-bottom:8px"></i>Loading...</div>';
  try{
    const res=await fetch(SITE_URL+"/_api/lists/getbytitle('EHS_Tools')/items?$filter=Status eq 'approved'&$orderby=Title&$top=500",{headers:{"Accept":"application/json;odata=verbose"}});
    const data=await res.json();
    TOOLS=data.d.results.map(item=>({
      name:item.Title,
      cat:item.Category,
      origin:item.Origin,
      level:item.Level,
      stars:item.Stars||3,
      problem:item.Problem||'',
      benefits:(item.Benefits||'').split(',').map(s=>s.trim()).filter(Boolean),
      costModel:item.CostModel||'',
      costRange:item.CostRange||'',
      impl:item.ImplTime||'',
      users:item.UserCount||'',
      docs:(item.Documentation||'').split(',').map(s=>s.trim()).filter(Boolean),
      contact:{name:item.ContactName||'',role:item.ContactRole||'',init:item.ContactInit||''}
    }));
  }catch(e){
    grid.innerHTML='<div class="empty"><i class="ti ti-alert-circle" style="font-size:26px;display:block;margin-bottom:8px"></i>Could not load tools. Check SITE_URL configuration.</div>';
    return;
  }
  buildChips();render();
}
loadTools();
</script>
